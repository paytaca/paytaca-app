<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Paytaca v0.27.0 — cover</title>
  <link rel="stylesheet" href="release.css" />
  <style>
    .cover-body {
      position: relative;
      z-index: 3;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.35rem;
    }

    .wordmark {
      font-size: 82px;
      letter-spacing: -0.035em;
      margin-top: 0.22em;
    }

    .version {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 220px;
      line-height: 0.9;
      letter-spacing: -0.05em;
      margin: 0.02em 0 0.14em;
      background: linear-gradient(105deg, var(--brand-deep) 2%, var(--brand) 46%, var(--brand-bright) 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      font-size: 1.72rem;
      line-height: 1.5;
      max-width: 44ch;
      margin: 0 auto;
    }

    .newchips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem;
      margin-top: 1.1rem;
      max-width: 720px;
    }

    .home-shot {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 0.9rem;
    }

    .home-shot .clip {
      position: relative;
      width: 480px;
      height: 675px;
      overflow: hidden;
    }

    .home-shot .phone {
      position: relative;
      width: 316px;
      height: 444px;
      margin: 0 auto;
      padding: 8px;
      border-radius: 52px 52px 0 0;
      transform: scale(1.52);
      transform-origin: top center;
      background: linear-gradient(165deg, #353e4f 0%, #10151f 62%);
      box-shadow:
        0 54px 96px -48px rgba(12, 20, 44, 0.60),
        0 24px 46px -26px rgba(12, 20, 44, 0.44),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.10);
    }

    .home-shot .screen {
      border-radius: 44px 44px 0 0;
    }

    .home-shot .fade {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80px;
      z-index: 40;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(246, 248, 255, 0) 0%, var(--bg) 88%);
    }

    .home-shot .statusbar {
      background: #edf3f3;
    }

    .home-shot .shot {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: block;
      object-fit: cover;
      object-position: top center;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="orb orb-brand" style="width: 720px; height: 720px; right: -200px; top: -120px; opacity: 0.40;"></div>
    <div class="orb orb-red" style="width: 460px; height: 460px; left: -200px; bottom: -160px; opacity: 0.18;"></div>
    <div class="grid"></div>
    <div class="scrim"></div>

    <div class="frame">
      <div class="topbar">
        <span class="brandmark">
          <img class="logo" src="../../../src/assets/paytaca_logo_horizontal.png" alt="Paytaca" />
        </span>
        <span class="chip">Bitcoin Cash wallet · non-custodial</span>
      </div>

      <div class="cover-body">
        <span class="eyebrow">New release · 2026-10-15</span>
        <h1 class="display wordmark">Paytaca</h1>
        <div class="version">v0.27.0</div>
        <p class="lede">MLS group chat, subscriptions, a refreshed Cauldron swap, and seamless referral handovers.</p>
        <div class="newchips">
          <span class="chip chip-brand">◆ MLS group chat</span>
          <span class="chip chip-brand">◆ Subscriptions</span>
          <span class="chip chip-brand">◆ Cauldron swap</span>
          <span class="chip chip-brand">◆ Seamless referrals</span>
          <span class="chip chip-red">◆ NFC payments</span>
        </div>

        <div class="home-shot">
          <div class="clip">
            <div class="phone">
              <span class="notch"></span>
              <div class="screen">
                <div class="statusbar">
                  <span class="time">9:41</span>
                  <span class="r">
                    <span class="mi">signal_cellular_alt</span>
                    <span class="mi">wifi</span>
                    <span class="mi">battery_full</span>
                  </span>
                </div>
                <img class="shot" src="assets/wallet-home.jpg" alt="Paytaca wallet" />
              </div>
            </div>
            <div class="fade"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
