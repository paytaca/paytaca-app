name: opencode

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Fork PRs are skipped: pull_request events from forks get a read-only
    # token, so the action cannot comment or push, and it aborts on the
    # "user does not have write permissions" assertion. A maintainer can still
    # run the bot on a fork PR by commenting "/oc" (that fires issue_comment
    # in the base repo, where the token and the actor are trusted).
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
        (startsWith(github.event.comment.body, '/oc') ||
         contains(github.event.comment.body, ' /oc') ||
         startsWith(github.event.comment.body, '/opencode') ||
         contains(github.event.comment.body, ' /opencode')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity and auth
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run opencode
        uses: anomalyco/opencode/github@v1.18.21
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # use_github_token makes the CLI authenticate with GITHUB_TOKEN
          # instead of exchanging an OIDC token for an app token. TOKEN is what
          # the v1.18.x bundled action read; the CLI is installed from the
          # latest release, so it is kept as a fallback.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/minimax-m3
          use_github_token: true
